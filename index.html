
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Feria Expoindustrial | Quanta</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .header {
      background: white;
      padding: 30px;
      border-radius: 16px;
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    
    .header h1 {
      font-size: 32px;
      color: #1a202c;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .header p {
      color: #718096;
      font-size: 16px;
    }
    
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #d1fae5;
      color: #065f46;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-left: auto;
    }
    
    .status-indicator.loading {
      background: #fef3c7;
      color: #92400e;
    }
    
    .pulse {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .filters {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      display: flex;
      gap: 16px;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    
    .filters label {
      font-weight: 600;
      color: #2d3748;
      font-size: 14px;
    }
    
    .filter-buttons {
      display: flex;
      gap: 8px;
    }
    
    .filter-btn {
      padding: 10px 20px;
      border: 2px solid #e2e8f0;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      color: #4a5568;
      transition: all 0.2s;
    }
    
    .filter-btn:hover {
      border-color: #E91E63;
      color: #E91E63;
    }
    
    .filter-btn.active {
      background: #E91E63;
      color: white;
      border-color: #E91E63;
    }
    
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .metric-card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      transition: transform 0.2s;
    }
    
    .metric-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    
    .metric-label {
      font-size: 14px;
      color: #718096;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    
    .metric-value {
      font-size: 48px;
      font-weight: 800;
      color: #1a202c;
      line-height: 1;
      margin-bottom: 8px;
    }
    
    .metric-detail {
      font-size: 13px;
      color: #a0aec0;
    }
    
    .metric-breakdown {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
      font-size: 13px;
    }
    
    .breakdown-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .breakdown-badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    
    .breakdown-badge.calendly {
      background: #dbeafe;
      color: #1e40af;
    }
    
    .breakdown-badge.landing {
      background: #fce7f3;
      color: #9f1239;
    }
    
    .section {
      background: white;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    
    .section h2 {
      font-size: 24px;
      color: #1a202c;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .ranking-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      background: #f7fafc;
      border-radius: 12px;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    
    .ranking-item:hover {
      background: white;
      border-color: #E91E63;
      transform: translateX(4px);
    }
    
    .ranking-position {
      font-size: 24px;
      font-weight: 800;
      color: #1a202c;
      min-width: 40px;
      text-align: center;
    }
    
    .ranking-position.first {
      color: #f59e0b;
    }
    
    .ranking-position.second {
      color: #94a3b8;
    }
    
    .ranking-position.third {
      color: #cd7f32;
    }
    
    .ranking-info {
      flex: 1;
    }
    
    .ranking-name {
      font-size: 18px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 4px;
    }
    
    .ranking-stats {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: #718096;
    }
    
    .ranking-count {
      font-size: 32px;
      font-weight: 800;
      color: #E91E63;
    }
    
    .table-container {
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    th {
      text-align: left;
      padding: 12px;
      background: #f7fafc;
      color: #4a5568;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    td {
      padding: 16px 12px;
      border-bottom: 1px solid #e2e8f0;
      color: #2d3748;
    }
    
    tr:hover {
      background: #f7fafc;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #a0aec0;
    }
    
    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #e2e8f0;
      border-top-color: #E91E63;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .error-message {
      background: #fee;
      color: #c00;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    @media (max-width: 768px) {
      .metrics-grid {
        grid-template-columns: 1fr;
      }
      
      .filters {
        flex-direction: column;
        align-items: stretch;
      }
      
      .filter-buttons {
        width: 100%;
      }
      
      .filter-btn {
        flex: 1;
      }
      
      .ranking-stats {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://cmtmracgtlbpyzjjjnrt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xPHnn56O1Wue-PAna0a0EA_nl9e589X';
    
    const { createClient } = window.supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function Dashboard() {
      const [selectedDay, setSelectedDay] = useState('todos');
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [lastUpdate, setLastUpdate] = useState(new Date());

      const fetchData = async () => {
        try {
          setLoading(true);
          setError(null);

          const dias = {
            '6': { 
              inicio: '2026-05-06T05:00:00.000Z',
              fin: '2026-05-07T04:59:59.999Z'
            },
            '7': { 
              inicio: '2026-05-07T05:00:00.000Z',
              fin: '2026-05-08T04:59:59.999Z'
            },
            '8': { 
              inicio: '2026-05-08T05:00:00.000Z',
              fin: '2026-05-09T04:59:59.999Z'
            },
            'todos': { 
              inicio: '2026-05-06T05:00:00.000Z',
              fin: '2026-05-09T04:59:59.999Z'
            }
          };

          const periodo = dias[selectedDay];

          let query = supabaseClient
            .from('landing_expoindustrial')
            .select('*')
            .gte('created_at', periodo.inicio)
            .lte('created_at', periodo.fin);

          const { data: result, error: queryError } = await query;

          if (queryError) throw queryError;

          setData(result || []);
          setLastUpdate(new Date());
        } catch (err) {
          setError(err.message);
          console.error('Error:', err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
        const interval = setInterval(fetchData, 30000);
        return () => clearInterval(interval);
      }, [selectedDay]);

      const totalContactados = data.length;
      const porCalendly = data.filter(l => l.fuente?.toLowerCase() === 'calendly').length;
      const porLanding = data.filter(l => l.fuente?.toLowerCase() === 'landing').length;
      const agendados = data.filter(l => l.meeting_scheduled === true).length;
      const tasaConversion = totalContactados > 0 ? ((agendados / totalContactados) * 100).toFixed(1) : 0;

      const comercialesMap = {};
      data.forEach(lead => {
        const comercial = lead.comercial || 'Sin asignar';
        if (!comercialesMap[comercial]) {
          comercialesMap[comercial] = {
            nombre: comercial,
            total: 0,
            agendados: 0,
            calendly: 0,
            landing: 0
          };
        }
        comercialesMap[comercial].total++;
        if (lead.meeting_scheduled) comercialesMap[comercial].agendados++;
        if (lead.fuente?.toLowerCase() === 'calendly') comercialesMap[comercial].calendly++;
        if (lead.fuente?.toLowerCase() === 'landing') comercialesMap[comercial].landing++;
      });

      const ranking = Object.values(comercialesMap).sort((a, b) => b.total - a.total);

      return (
        <div className="container">
          <div className="header">
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div>
                <h1>🎯 Dashboard Feria Expoindustrial</h1>
                <p>Mayo 6-8, 2026 • Actualización en tiempo real</p>
              </div>
              <div className={`status-indicator ${loading ? 'loading' : ''}`}>
                {loading ? (
                  <>
                    <div className="loading-spinner"></div>
                    Cargando...
                  </>
                ) : (
                  <>
                    <span className="pulse"></span>
                    Actualizado {lastUpdate.toLocaleTimeString('es-CO')}
                  </>
                )}
              </div>
            </div>
          </div>

          {error && (
            <div className="error-message">
              ⚠️ Error: {error}
            </div>
          )}

          <div className="filters">
            <label>Día de feria:</label>
            <div className="filter-buttons">
              <button 
                className={`filter-btn ${selectedDay === 'todos' ? 'active' : ''}`}
                onClick={() => setSelectedDay('todos')}
              >
                Todos los días
              </button>
              <button 
                className={`filter-btn ${selectedDay === '6' ? 'active' : ''}`}
                onClick={() => setSelectedDay('6')}
              >
                Mayo 6
              </button>
              <button 
                className={`filter-btn ${selectedDay === '7' ? 'active' : ''}`}
                onClick={() => setSelectedDay('7')}
              >
                Mayo 7
              </button>
              <button 
                className={`filter-btn ${selectedDay === '8' ? 'active' : ''}`}
                onClick={() => setSelectedDay('8')}
              >
                Mayo 8
              </button>
            </div>
          </div>

          <div className="metrics-grid">
            <div className="metric-card">
              <div className="metric-label">Total Contactados</div>
              <div className="metric-value">{totalContactados}</div>
              <div className="metric-detail">Leads registrados en feria</div>
              <div className="metric-breakdown">
                <div className="breakdown-item">
                  <span className="breakdown-badge calendly">Calendly: {porCalendly}</span>
                </div>
                <div className="breakdown-item">
                  <span className="breakdown-badge landing">Landing: {porLanding}</span>
                </div>
              </div>
            </div>

            <div className="metric-card">
              <div className="metric-label">Reuniones Agendadas</div>
              <div className="metric-value">{agendados}</div>
              <div className="metric-detail">De {totalContactados} contactados</div>
            </div>

            <div className="metric-card">
              <div className="metric-label">Tasa de Conversión</div>
              <div className="metric-value">{tasaConversion}%</div>
              <div className="metric-detail">Leads → Reunión agendada</div>
            </div>
          </div>

          <div className="section">
            <h2>🏆 Ranking de Comerciales</h2>
            {ranking.length === 0 ? (
              <div className="empty-state">
                <p>No hay datos para mostrar en este período</p>
              </div>
            ) : (
              <div className="ranking-list">
                {ranking.map((comercial, index) => (
                  <div key={comercial.nombre} className="ranking-item">
                    <div className={`ranking-position ${
                      index === 0 ? 'first' : index === 1 ? 'second' : index === 2 ? 'third' : ''
                    }`}>
                      #{index + 1}
                    </div>
                    <div className="ranking-info">
                      <div className="ranking-name">{comercial.nombre}</div>
                      <div className="ranking-stats">
                        <span>✅ {comercial.agendados} agendados</span>
                        <span>📅 {comercial.calendly} Calendly</span>
                        <span>🌐 {comercial.landing} Landing</span>
                      </div>
                    </div>
                    <div className="ranking-count">{comercial.total}</div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="section">
            <h2>📊 Detalle por Origen</h2>
            <div className="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Fuente</th>
                    <th>Total Leads</th>
                    <th>Agendados</th>
                    <th>Tasa Conversión</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td><span className="breakdown-badge calendly">Calendly</span></td>
                    <td>{porCalendly}</td>
                    <td>{data.filter(l => l.fuente?.toLowerCase() === 'calendly' && l.meeting_scheduled).length}</td>
                    <td>{porCalendly > 0 ? ((data.filter(l => l.fuente?.toLowerCase() === 'calendly' && l.meeting_scheduled).length / porCalendly) * 100).toFixed(1) : 0}%</td>
                  </tr>
                  <tr>
                    <td><span className="breakdown-badge landing">Landing</span></td>
                    <td>{porLanding}</td>
                    <td>{data.filter(l => l.fuente?.toLowerCase() === 'landing' && l.meeting_scheduled).length}</td>
                    <td>{porLanding > 0 ? ((data.filter(l => l.fuente?.toLowerCase() === 'landing' && l.meeting_scheduled).length / porLanding) * 100).toFixed(1) : 0}%</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Dashboard />);
  </script>
</body>
</html>
